name: Deploy to Cloudflare

# Rebuilds the site on every push to main, warns if the committed site/ is
# out of date with src/, then deploys the fresh build to Cloudflare Workers. Deploys only when
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python src/build.py
      - name: Check committed site/ matches src/
        run: git diff --quiet -- site || echo "::warning::Committed site/ differs from a fresh build. Run python3 src/build.py and commit. Deploying the fresh build."
      - name: Deploy to Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.150.0'
          command: deploy
      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed. See README."
