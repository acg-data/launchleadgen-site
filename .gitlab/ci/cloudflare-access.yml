cloudflare:access:
  stage: checks
  image: node:22-bookworm
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  - when: never
  script:
  - node .gitlab/scripts/verify-cloudflare-access.mjs
  artifacts:
    when: always
    access: maintainer
    expire_in: 7 days
    paths:
    - .ci-results/cloudflare-ci-access.json
