deploy:deploy:
  stage: checks
  image: node:22-bookworm
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "deploy"
    when: manual
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main")
    when: manual
    allow_failure: true
  - when: never
  script:
  - bash .gitlab/scripts/deploy--deploy.sh
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
  resource_group: deploy-$CI_COMMIT_REF_SLUG
  before_script:
  - apt-get update -qq && apt-get install -y -qq python3 python3-venv
  - python3 -m venv /tmp/ci-python && export PATH="/tmp/ci-python/bin:$PATH"
